services:
  backend:
    build: ./backend
    ports: ["8001:8000"]
    environment:
      DATABASE_URL: sqlite:///./emotion_music.db
      SECRET_KEY: your-super-secret-key-change-in-production-at-least-32-chars!!
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    build: ./frontend
    ports: ["5174:80"]
    depends_on: [backend]
